# 服务器生产环境配置（启动参数 --spring.profiles.active=prod 激活，仅覆盖与本地不同的项）
ruoyi:
  # 文件路径（Linux示例 /home/ruoyi/uploadPath）
  profile: /home/ruoyi/uploadPath

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 生产环境配置
spring:
  # 服务模块
  devtools:
    restart:
      # 热部署开关（生产关闭）
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
  # 数据源配置
  datasource:
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
        username: root
        password: "123456"
